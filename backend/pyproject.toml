[project]
name = "intelligence-hub-server"
version = "0.1.0"
description = "FastAPI backend for Intelligence Hub"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "deepagents>=0.3,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "minio>=7.2,<8",
  "pgvector>=0.4,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
