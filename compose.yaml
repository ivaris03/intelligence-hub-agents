services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: intelligence_hub_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - intelligence-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelligence_hub_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intelligence-hub-postgres:
