name: intelligence-hub

services:
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://intelligence_hub:${INTELLIGENCE_POSTGRES_PASSWORD:?INTELLIGENCE_POSTGRES_PASSWORD is required}@ivaris-postgres:5432/intelligence_hub_agents
    command: ["alembic", "upgrade", "head"]
    networks: [shared_database]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WEB_ORIGIN: https://${SITE_DOMAIN:-intelligence.ivaris.top}
      DATABASE_URL: postgresql+asyncpg://intelligence_hub:${INTELLIGENCE_POSTGRES_PASSWORD:?INTELLIGENCE_POSTGRES_PASSWORD is required}@ivaris-postgres:5432/intelligence_hub_agents
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: intelligence-hub-agents
      MINIO_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal, shared_database]

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18100:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
  shared_database:
    name: ivaris-shared
    external: true

volumes:
  minio-data:
