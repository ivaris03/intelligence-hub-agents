name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend_ci:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: intelligence_hub_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligence_hub_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/intelligence_hub_agents
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Validate migrations
        run: uv run alembic upgrade head
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  frontend_ci:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  publish_images:
    name: Publish container images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend_ci, frontend_ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}/backend:production" >> "$GITHUB_OUTPUT"
          echo "backend_sha=ghcr.io/${repository}/backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}/frontend:production" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=ghcr.io/${repository}/frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}
            ${{ steps.images.outputs.backend_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}
            ${{ steps.images.outputs.frontend_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy_production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish_images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: Production
      url: https://intelligence.ivaris.top
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/intelligence-hub-agents' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment bundle
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          BACKEND_IMAGE: ${{ needs.publish_images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.publish_images.outputs.frontend_image }}
        run: |
          test -n "$PRODUCTION_ENV_FILE"
          test -n "$AUTH_SECRET_KEY"
          if (( ${#AUTH_SECRET_KEY} < 32 )); then
            echo "AUTH_SECRET_KEY must contain at least 32 characters" >&2
            exit 1
          fi
          install -m 700 -d .deploy
          cp compose.production.yaml deploy/remote-deploy.sh deploy/nginx/intelligence.ivaris.top.conf .deploy/
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .deploy/.env.production
          sed -i '/^AUTH_SECRET_KEY=/d' .deploy/.env.production
          printf '\nAUTH_SECRET_KEY=%s\nBACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' \
            "$AUTH_SECRET_KEY" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" \
            >> .deploy/.env.production
          chmod 600 .deploy/.env.production
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload deployment bundle
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            .deploy/compose.production.yaml .deploy/remote-deploy.sh \
            .deploy/intelligence.ivaris.top.conf .deploy/.env.production \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$DEPLOY_PATH/.env.production'"
      - name: Pull and start Production
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && DEPLOY_PATH='$DEPLOY_PATH' bash remote-deploy.sh"
      - name: Verify public health endpoint
        shell: bash
        run: curl --fail --show-error --silent --retry 30 --retry-delay 5 --retry-all-errors https://intelligence.ivaris.top/api/health
